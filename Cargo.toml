[package]
name = "rcan"
version = "0.5.0"
edition = "2021"
readme = "README.md"
description = "Really simple user Controlled Authorization Networks"
license = "MIT OR Apache-2.0"
authors = ["dignifiedquire <me@dignifiedquire.com>"]
repository = "https://github.com/n0-computer/rcan"

rust-version = "1.91"

[dependencies]
derive_more = { version = "2.0.1", features = ["debug", "display"] }
ed25519-dalek = { version = ">=3.0.0-rc.0,<4.0.0", features = ["serde"] }
data-encoding = "2"
data-encoding-macro = "0.1"
n0-error = "1"
hex = "0.4.3"
n0-future = "0.3.2"
# postcard provides the capability byte codec (the blanket `CapabilityEncoding`
# impl over serde-able capability types) and the varint encoding of the
# delegation wire format's numeric fields.
postcard = { version = "1.1.1", features = ["use-std"] }
serde = { version = "1.0.217", features = ["derive"] }

[dev-dependencies]
assert_matches = "1.5.0"
ron = "0.8"
serde_cbor = "0.11"
serde_json = "1"
